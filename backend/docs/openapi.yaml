      required:
      - id
      - campaign_id
      - piece_id
      - user_id
      - user_name
      - action
      - version_no
      - detail
      - created_at
      title: ActivityOut
    ApproveIn:
      properties:
        version_no:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Version No
          description: If given, must equal the current version (guards against reviewing a stale draft).
      type: object
      title: ApproveIn
