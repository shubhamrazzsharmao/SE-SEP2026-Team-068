openapi: 3.1.0
info:
  title: ContentFlow API
  description: '

    Backend for **ContentFlow** (Team 068): AI-assisted multi-channel content generation with a

    human-in-the-loop review workflow.


    **Authentication.** Users sign in with Supabase Auth in the frontend; every call (except

    `/health`) sends `Authorization: Bearer <access_token>`.


    **Authorisation.** Roles are per campaign: `owner`, `creator`, `reviewer`, `brand_manager`.

    Non-members get `404` (campaigns are invisible to outsiders); members whose role does not allow

    an action get `403`.


    **Errors.** Every error has the shape `{"detail": "...", "code": "..."}`; validation errors add

    an `errors` list; a failed AI call adds `job_id`.


    **Status flow.** `pending_review` -> `approved` | `rejected` (final) | `pending_review` with a new

    version after *request changes*. Versions are append-only. Nothing is published automatically.

    '
  version: 1.0.0-sprint1
paths:
  /api/v1/me:
    get:
      tags:
      - Account
      summary: Get Me
      description: 'Return the signed-in user''s profile.


        Users sign up and log in through Supabase Auth in the frontend. The first authenticated

        call creates the matching profile row (name and email are taken from the token), so

        the frontend should call this once after login. A user must have done so before a

        campaign owner can add them by email.


        **User stories:** US11 (access is organised per user).'
      operationId: get_me_api_v1_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '401':
          description: Missing, malformed, expired or forged bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated, but the campaign role does not allow this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
      x-user-stories:
      - US11
  /api/v1/brands:
