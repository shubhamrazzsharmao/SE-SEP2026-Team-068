      properties:
        name:
          type: string
          maxLength: 150
          minLength: 1
          title: Name
        tone:
          type: string
          maxLength: 5000
          minLength: 1
          title: Tone
          description: Brand voice, e.g. 'warm, practical, no jargon'.
        preferred_terms:
          items:
            type: string
          type: array
          title: Preferred Terms
          description: Terms to use.
        avoided_terms:
          items:
            type: string
          type: array
          title: Avoided Terms
          description: Terms never to use.
      type: object
      required:
      - name
      - tone
      title: BrandIn
