          anyOf:
          - type: integer
          - type: 'null'
          title: Piece Id
        user_id:
          type: string
          format: uuid
          title: User Id
        user_name:
          type: string
          title: User Name
        action:
          type: string
          title: Action
        version_no:
          anyOf:
          - type: integer
          - type: 'null'
