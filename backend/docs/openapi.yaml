      properties:
        id:
          type: integer
          title: Id
        owner_id:
          type: string
          format: uuid
          title: Owner Id
        name:
          type: string
          title: Name
        tone:
          type: string
          title: Tone
        preferred_terms:
          items:
            type: string
          type: array
          title: Preferred Terms
        avoided_terms:
          items:
            type: string
          type: array
          title: Avoided Terms
        updated_by:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Updated By
