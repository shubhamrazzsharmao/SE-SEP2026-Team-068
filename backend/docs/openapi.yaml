              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
      x-user-stories:
      - US5
      - US11
    post:
      tags:
      - Brands
      summary: Create Brand
      description: 'Create a brand (the client and its voice): tone, preferred terms and terms to avoid.


        The caller becomes the brand owner. Brand names are unique per owner.


        **User stories:** US5 (define brand guidelines), US11 (client -> campaign hierarchy).'
      operationId: create_brand_api_v1_brands_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandOut'
        '401':
          description: Missing, malformed, expired or forged bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict with the current state (duplicate, locked brief, invalid status transition,
            stale version).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request body or parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
