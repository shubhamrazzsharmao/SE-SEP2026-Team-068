  /api/v1/briefs/{brief_id}/generate:
    post:
      tags:
      - Briefs & generation
      summary: Generate
      description: 'Generate one content piece per platform in the brief, using the brief and the brand

        guidelines (tone, preferred and avoided terms).


        Every piece is saved as version 1 (`ai_generated`) with status `pending_review`. Nothing

        is ever published or approved automatically. Generation is all-or-nothing: if the AI

        provider fails for any platform, **no** piece is saved, the job is recorded as `failed`,

        the brief returns to `draft`, and the call returns 502 so the user can retry.


        Roles: `owner`, `creator`. A brief can be generated once (409 afterwards).


        **User stories:** US3 (generate platform-specific content from one brief), US6.'
      operationId: generate_api_v1_briefs__brief_id__generate_post
      security:
      - BearerAuth: []
      parameters:
      - name: brief_id
        in: path
        required: true
        schema:
          type: integer
          title: Brief Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateOut'
        '401':
          description: Missing, malformed, expired or forged bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated, but the campaign role does not allow this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource does not exist, or the caller is not a member of its campaign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict with the current state (duplicate, locked brief, invalid status transition,
            stale version).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The AI provider failed. Nothing was saved; the request can be retried.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request body, query or path parameters failed validation.
          content:
            application/json:
              schema:
